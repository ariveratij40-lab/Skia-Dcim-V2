server {
    listen 80;
    server_name skia.iamet.mx mvp.skia.iamet.mx;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name skia.iamet.mx mvp.skia.iamet.mx;
    ssl_certificate /etc/letsencrypt/live/mvp.skia.iamet.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mvp.skia.iamet.mx/privkey.pem;

    # Archivos subidos (imágenes, PDFs) — servidos por el backend Go
    location /uploads/ {
        proxy_pass http://skia_api_staging:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cache de imágenes estáticas
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://skia_api_staging:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /;
        proxy_cookie_flags ~ secure httponly samesite=none;
        # Permitir uploads grandes (imágenes, PDFs)
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://skia_web_staging:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
