version: '3.8'

# ============================================================
# SKIA DCIM Platform — docker-compose.yml
#
# REGLAS CRÍTICAS VPS (NO MODIFICAR):
#   - Red externa: infra_network (compartida con Nginx global)
#   - Nginx upstream: proxy_pass http://skia_web_staging:3000
#   - Nginx upstream: proxy_pass http://skia_api_staging:8080
#   - DATABASE_URL siempre apunta a skia_postgres_staging:5432
#   - NO usar localhost para PostgreSQL
# ============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  skia_postgres_staging:
    image: postgres:16-alpine
    container_name: skia_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: skia_db
      POSTGRES_USER: skia_user
      POSTGRES_PASSWORD: skia_dev_pass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skia_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skia_user -d skia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  skia_redis:
    image: redis:7-alpine
    container_name: skia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass skia_redis_dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - skia_redis_data:/data
    networks:
      - infra_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "skia_redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ─────────────────────────────────────────────────
  skia_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skia.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - infra_network
    depends_on:
      skia_postgres_staging:
        condition: service_healthy

  # ── Backend Go API ──────────────────────────────────────────
  skia_api_staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skia_api_staging
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8080
      DB_HOST: skia_postgres_staging
      DB_PORT: 5432
      DB_NAME: skia_db
      # C-4 / C-5: el API corre como skia_runtime (sin SUPERUSER/BYPASSRLS/
      # CREATEROLE/CREATEDB), no como skia_user. skia_user queda reservado
      # para operaciones administrativas/migraciones (ver ops/2026-08-05_*.sql).
      DB_USER: skia_runtime
      # La contraseña de skia_runtime NO debe quedar hardcodeada en este
      # archivo versionado (ver A-2, gestión de secretos, aún abierto).
      # Debe proveerse vía variable de entorno del host/orquestador.
      DB_PASSWORD: ${SKIA_RUNTIME_DB_PASSWORD:?SKIA_RUNTIME_DB_PASSWORD no está definida}
      REDIS_HOST: skia_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: skia_redis_dev
      JWT_SECRET: skia_dev_jwt_secret_change_in_prod
      UPLOADS_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-402857908300-k0no4a68lhgu8f3r03kcq89hetg4mnsa.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://skia.iamet.mx/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://skia.iamet.mx}
      # DATABASE_URL — NUNCA usar localhost; siempre el nombre del contenedor
      # C-5: esta es la variable que backend/main.go realmente lee para
      # conectarse (os.Getenv("DATABASE_URL"); ver main.go:103). Las claves
      # DB_HOST/DB_USER/DB_PASSWORD/DB_NAME de arriba NO son leídas por el
      # binario Go -- son configuración muerta. Verificar el rol efectivo
      # de conexión debe hacerse contra ESTA variable (o contra
      # pg_stat_activity en vivo), no contra DB_USER.
      DATABASE_URL: postgres://skia_runtime:${SKIA_RUNTIME_DB_PASSWORD:?SKIA_RUNTIME_DB_PASSWORD no está definida}@skia_postgres_staging:5432/skia_db?sslmode=disable
    volumes:
      - skia_uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - infra_network
    depends_on:
      skia_postgres_staging:
        condition: service_healthy
      skia_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend Next.js ────────────────────────────────────────
  skia_web_staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skia_web_staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_API_URL: usado por el cliente (browser) — apunta al dominio público
      # INTERNAL_API_URL: usado por el servidor Next.js (SSR/rewrites) — nombre del contenedor
      NEXT_PUBLIC_API_URL: http://skia_api_staging:8080
      INTERNAL_API_URL: http://skia_api_staging:8080
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - infra_network
    depends_on:
      skia_api_staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

# ── Volúmenes ────────────────────────────────────────────────
volumes:
  skia_postgres_data:
    driver: local
  skia_redis_data:
    driver: local
  skia_uploads:
    driver: local

# ── Red externa compartida con Nginx global ──────────────────
# CRÍTICO: NO cambiar a bridge local ni crear redes nuevas.
# Nginx del VPS usa esta red para resolver los upstreams:
#   proxy_pass http://skia_web_staging:3000;
#   proxy_pass http://skia_api_staging:8080;
networks:
  infra_network:
    external: true
